name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Paired policy tests execute the hash-pinned historical baseline.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies on purpose: this tool must import on a bare interpreter.
      - name: syntax
        run: python -m compileall -q .
      - name: policy tests (offline, no tokens)
        run: python test_rightsize.py
      - name: quota and launch regressions
        run: python test_reliability.py
      - name: caller judgment contract
        run: python test_judgment.py
      - name: scoped credentials and native probe deadlines
        run: |
          python test_credentials.py
          python test_native_rpc.py
          python test_accounts.py
          python test_minimax.py
          python test_task_fit.py
      - name: consumer classification and acceptance evidence
        run: |
          python test_task_judgment.py
          python test_outcome_store.py
          python test_consumer_outcomes.py
      - name: hook matching
        run: python hooks/test_hook.py
      - name: bounded context selection
        run: python test_context.py
      - name: offline baseline replay and shadow
        run: |
          python test_replay.py
          python rightsize.py replay --snapshot fixtures/replay.json
      - name: paired pilot corpus (offline only)
        run: |
          python test_pilot_tasks.py
          python test_pilot_acceptance.py
          python test_pilot_run.py
          python test_pilot_execution.py
          python test_pilot_native.py
      - name: managed admission and fake launch lifecycle
        run: |
          python test_managed_ledger.py
          python test_managed_router.py
          python test_state_migration.py
      - name: native transport and Codex lifecycle
        run: |
          python test_native_transport.py
          python test_native_codex.py
          python test_native_claude.py
          python test_claude_execution.py
          python test_native_opencode.py
          python test_opencode_execution.py
      - name: config is valid json
        run: python -c "import json;json.load(open('config.json'))"
      - name: cli responds without credentials
        run: |
          python rightsize.py --help
          python rightsize.py route --task "rename a local variable" --json || true
  pilot-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: fetch pinned acceptance runtime (no model requests)
        run: docker pull python@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0
      - name: prove acceptance and container isolation
        env:
          RIGHTSIZE_TEST_DOCKER: "1"
        run: python test_pilot_acceptance.py
